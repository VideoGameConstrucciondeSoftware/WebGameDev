<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/css/style.css">

</head>
<body class="fondo1">
    <section id="technologies" class="technologies-section altura">
        <h2 class="technologies-title">Tecnologías</h2>
        <p class="technologies-desc">
            Estas son las principales tecnologías que utilizamos para desarrollar nuestro proyecto, asegurando calidad, rendimiento y una experiencia moderna.
        </p>
        <div class="cards-container">
            <div class="tech-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML5 logo">
                <p class="tech-name">HTML5</p>
            </div>
            <div class="tech-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS3 logo">
                <p class="tech-name">CSS3</p>
            </div>
            <div class="tech-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JS logo">
                <p class="tech-name">JavaScript</p>
            </div>
            <div class="tech-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/unity/unity-original.svg" alt="Unity logo">
                <p class="tech-name">Unity</p>
            </div>
            <div class="tech-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original-wordmark.svg" />
                <p class="tech-name">SQL Server</p>
            </div>
            <div class="tech-card">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/azuredevops/azuredevops-original.svg" alt="Azure DevOps logo">
                <p class="tech-name">Azure DevOps</p>
            </div>
        </div>
    </section>
</body>
</html>
