<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Page Bar</title>
    <link rel="stylesheet" href="/src/css/GamePageBar.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <nav class="contenedor">

      <div class="logo">
        <img src="src/img/Logo.png" alt="Logo del juego" />
      </div>

      <ul class="menu desktop">
        <li><a href="/GamePage.html">Play</a></li>
        <li><a href="#">Social</a></li>
        <li><a href="/leaderboard.html">Scoreboard</a></li>
        <li><a href="/Tutoriales.html">FAQs</a></li>

      <div class="play-button desktop">
        <a href="Login.html" class="btn-logout">Log Out</a>
      </div>

      <!-- Menú hamburguesa móvil sin emojis -->
      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="menu-icon">
        <span></span>
      </label>

      <ul class="menu mobile">
        <li><a href="/GamePage.html">Play</a></li>
        <li><a href="#">Social</a></li>
        <li><a href="/leaderboard.html">Scoreboard</a></li>
        <li><a href="/Tutoriales.html">FAQs</a></li>
        <li><a href="/SettingsUser.html">Settings Profile</a></li>
      </ul>
    </nav>
  </header>

</html>
