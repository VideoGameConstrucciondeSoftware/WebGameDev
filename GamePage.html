<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Juego</title>
  <link rel="stylesheet" href="/src/css/GamePage.css" />
</head>
<body>
  <main>
    <!-- Contenedor principal -->
    <div class="imagen-fondo">
      <!-- Barra superior cargada externamente -->
      <div id="GamePage-container"></div> 

      <!-- Título con fondo gradiente -->
      <div class="contenedor3">
        <h1 class="titulo">Untoten Nacht</h1>
      </div>

      <!-- Descripción estilizada -->
      <div class="contenedor2">
        <p class="descripcion">Disponible ahora en PC — ¡Sobrevive a la noche!</p>
        <button class="jugar-btn">Jugar Ahora</button>
      </div>
    </div>
  </main>

  <script src="/src/js/config.js"></script>
  <script src="/src/js/main.js"></script>
  <script>
    const jugarBtn = document.querySelector(".jugar-btn");
    jugarBtn.addEventListener("click", function () {
      const token = localStorage.getItem("token");
        const url = `https://videogameconstrucciondesoftware.github.io/Juego/`;
        window.location.href = url;
    });
  </script>
  <script>
    function GetTokenFromURL() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      if (token) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      return token;
    }
  </script>
</body>
</html>
